spring.application.name=pesa-wallet-api
# Honour a PORT environment variable (common on hosting platforms); default 8080
server.port=${PORT:8080}

# Default: in-memory H2 so the API runs with zero setup. Use the "postgres" profile for a real database.
spring.datasource.url=jdbc:h2:mem:wallet;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Only expose health/info from actuator
management.endpoints.web.exposure.include=health,info

# Swagger UI at /swagger-ui.html, OpenAPI JSON at /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
